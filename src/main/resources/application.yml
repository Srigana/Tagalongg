spring:
  application:
    name: tagalong

  datasource:
    url: jdbc:postgresql://localhost:5432/tagalong
    username: ${DB_USER:tagalong}
    password: ${DB_PASSWORD:tagalong}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: tagalong-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tagalong.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-prod-please}
  expiration-ms: 86400000

stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_replace_me}

kafka:
  topics:
    post-created: post-created
    request-made: request-made
    status-updated: status-updated
